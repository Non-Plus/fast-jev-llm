name: Release

# Publishes only when a version tag is pushed (e.g. v0.1.0).
# Configure npm trusted publishing for this repository before the first tag.
# Do not publish from ordinary pushes to main.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build
      - name: Pack (inspect, do not upload)
        working-directory: cli
        run: npm pack --dry-run --ignore-scripts
      - name: Publish
        working-directory: cli
        run: npm publish --access public --provenance
