name: Release

# Publishes fast-jev-llm to npm when a version tag is pushed (e.g. v0.1.1).
# npm publish runs only in the protected `npm` environment (human approval).
# See docs/PUBLISHING_RULES.md and docs/NPM_PUBLISHING.md.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches cli/package.json version
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./cli/package.json').version")"
          if [[ "$TAG" != "$PKG" ]]; then
            echo "Tag v${TAG} does not match cli/package.json version ${PKG}"
            exit 1
          fi
          echo "Release version ${PKG} verified"

      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Upgrade npm for trusted publishing (OIDC)
        run: npm install -g npm@latest

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build

      - name: Inspect npm pack
        working-directory: cli
        run: npm pack --dry-run --ignore-scripts

  publish:
    name: Publish to npm
    needs: verify
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm for trusted publishing (OIDC)
        run: npm install -g npm@latest

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Publish to npm (OIDC trusted publishing)
        working-directory: cli
        env:
          NPM_CONFIG_PROVENANCE: "true"
        run: |
          npm whoami || true
          npm publish --access public --provenance
